name: FindMe staging checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flask-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py config.py db.py db_neon.py ai wsgi.py
      - name: Smoke test public routes without database credentials
        env:
          FINDME_ENV: development
        run: |
          python - <<'PY'
          from wsgi import application
          client = application.test_client()
          assert client.get('/healthz').status_code == 200
          assert client.get('/health').status_code == 200
          assert client.get('/').status_code == 200
          print('Public Flask smoke tests passed')
          PY
